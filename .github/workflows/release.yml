name: Release

# Publishing a GitHub release with a new tag vX.Y.Z builds that tag as version X.Y.Z and attaches the
# jars. The version comes from the tag (-Drevision), so no version-bump commit is needed beforehand.
# See docs/RELEASE.md.

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and re-attach artifacts for (e.g. v2.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release tag '${TAG}' must look like vX.Y.Z (e.g. v2.1.0)." >&2
            echo "Delete this release and its tag, then publish a new release with a vX.Y.Z tag." >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: ./mvnw -B -Drevision="${VERSION}" verify

      - name: Check release version
        run: .github/scripts/check-release-version.sh "${VERSION}"

      # Publishing to Maven Central -- which the java-buildpack dependency pipeline watches -- goes
      # here once the org.cloudfoundry signing key and Central credentials are available as secrets.

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIR=java-buildpack-client-certificate-mapper/target
          gh release upload "${TAG}" --clobber \
            "${DIR}/java-buildpack-client-certificate-mapper-${VERSION}.jar" \
            "${DIR}/java-buildpack-client-certificate-mapper-${VERSION}-sources.jar" \
            "${DIR}/java-buildpack-client-certificate-mapper-${VERSION}-javadoc.jar"
